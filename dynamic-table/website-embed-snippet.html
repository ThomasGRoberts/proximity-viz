<style>
  .espl-episodes-page{--ink:#303030;--muted:#69645b;max-width:1220px;margin:0 auto;color:var(--ink);font-family:inherit;container-type:inline-size}
  .espl-episodes-page *{box-sizing:border-box}
  .espl-episodes-page .intro{position:relative;width:100vw;margin-left:calc(50% - 50vw);border-top:1px solid #e8dfc9;border-bottom:1px solid #e8dfc9;background:linear-gradient(120deg,#fff5d9,#fffcf6 68%)}
  .espl-episodes-page .intro-inner{width:calc(100vw - 24px);max-width:1220px;margin:0 auto;padding:clamp(22px,4vw,48px) 0}
  .espl-episodes-page:not([data-language-source="live"]) .intro-inner{visibility:hidden}
  @supports(width:100cqw){.espl-episodes-page .intro-inner{width:100cqw}}
  .espl-episodes-page .about-link{display:inline-flex;align-items:center;gap:.45em;color:#5f6265;font:700 12px/1.2 Roboto,Arial,sans-serif;letter-spacing:.07em;text-decoration:none;text-transform:uppercase;transition:opacity .18s ease}
  .espl-episodes-page .about-link:hover,.espl-episodes-page .about-link:focus-visible{color:#5f6265;opacity:.65;text-decoration:none}
  .espl-episodes-page .about-link svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform 220ms cubic-bezier(.22,1,.36,1)}
  .espl-episodes-page .about-link:hover svg,.espl-episodes-page .about-link:focus-visible svg{transform:translateX(-4px)}
  .espl-episodes-page .about-link{margin:0 0 15px}
  .espl-episodes-page .repo-kicker{display:flex;align-items:center;gap:9px;margin:0 0 12px;color:#79601f;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .espl-episodes-page .repo-icon{width:42px;height:42px;flex:none}
  .espl-episodes-page .repo-scan{transition:transform .38s ease,opacity .38s ease}
  .espl-episodes-page .repo-kicker:hover .repo-scan{transform:translateY(11px);opacity:.6}
  .espl-episodes-page h1{margin:0 0 12px;font-size:clamp(27px,3vw,42px);line-height:1.12}
  .espl-episodes-page .description{max-width:72ch;margin:0;color:#514d45;font-size:15px;line-height:1.55}
  .espl-episodes-page .description p{margin:0 0 10px}
  .espl-episodes-page .description p:last-child{margin-bottom:0}
  .espl-episodes-page .contributors{display:block;padding:22px 0 52px;background:#fff}
  .espl-episodes-page .contributors-label{display:block;margin-bottom:10px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .espl-episodes-page .people{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
  .espl-episodes-page .people li{margin:0;padding:0}
  .espl-episodes-page .people a{display:block;width:76px;height:76px;border-radius:50%;background:#fff;transition:transform 260ms cubic-bezier(.34,1.56,.64,1)}
  .espl-episodes-page .people a:hover,.espl-episodes-page .people a:focus-visible{transform:translateY(-2px) scale(1.055)}
  .espl-episodes-page .people img,.espl-episodes-page .espl-contributor-initials{display:grid;place-items:center;width:76px;height:76px;object-fit:cover;border:0;border-radius:50%;background:#fff;color:#735b21;font-size:20px;font-weight:700;box-shadow:none}
  .espl-episodes-page .repo-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:17px;color:#70695c;font-size:11px}
  .espl-episodes-page .repo-meta-divider{color:#a9a08e;font-size:10px}
  .espl-episodes-page .repo-link{display:inline-flex;align-items:center;gap:4px;color:#686868;text-decoration:none;font-size:11px}
  .espl-episodes-page .repo-link:hover,.espl-episodes-page .repo-link:focus-visible{color:#454545}
  .espl-episodes-page .repo-link svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
  .espl-episodes-page .repo-link .external-box,.espl-episodes-page .repo-link .external-arrow{transition:opacity .22s ease,transform .22s cubic-bezier(.22,1,.36,1)}
  .espl-episodes-page .repo-link:is(:hover,:focus-visible) .external-box{opacity:.58;transform:scale(.96)}
  .espl-episodes-page .repo-link:is(:hover,:focus-visible) .external-arrow{transform:translate(2.4px,-2.4px)}
  .espl-episodes-page iframe{display:block;width:100%;height:920px;margin:0;padding:0;border:0;background:#fff}
  @media(max-width:700px){.espl-episodes-page .intro-inner{padding-top:22px;padding-bottom:22px}.espl-episodes-page .people a,.espl-episodes-page .people img,.espl-episodes-page .espl-contributor-initials{width:54px;height:54px}.espl-episodes-page iframe{height:900px}}
  @media(prefers-reduced-motion:reduce){.espl-episodes-page .repo-scan,.espl-episodes-page .people a,.espl-episodes-page .about-link svg{transition:none}}
</style>
