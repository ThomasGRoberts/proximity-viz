<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episodes of Concern · ESPL</title>
  <link rel="icon" href="./assets/polyhedron-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="component-wrap">
    <section class="library" aria-label="Episodes of Concern table">
      <div class="toolbar">
        <label class="search-field"><span class="visually-hidden">Search episodes</span><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.7"/><path d="m13 13 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search episodes or space objects"></label>
        <label class="select-field">Orbit <select id="orbit"><option value="">All regimes</option></select></label>
        <button id="reset" class="text-action" type="button">Reset filters</button>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <div id="preview-controls" class="preview-controls" hidden><label><input id="preview-toggle" type="checkbox"> <span class="preview-label">Preview all episodes</span> <small>(local development only)</small></label></div>
      <div id="earth-controls" class="earth-controls" hidden><label for="earth-choice">Preview Earth tone</label><select id="earth-choice"><option value="warm">Light warm gray</option><option value="stone">Pale stone gray</option><option value="taupe">Light taupe-gray</option><option value="neutral">Neutral brown-gray</option></select><span id="earth-swatch" class="earth-swatch" aria-hidden="true"></span><small>Local comparison only</small></div>
      <div id="status" class="status" role="status">Loading published records…</div>
      <div class="table-wrap"><table><thead><tr>
        <th scope="col"><button class="sort-head" data-sort="title" type="button">Episode <span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col">Space objects</th>
        <th scope="col"><button class="sort-head" data-sort="date" type="button">Period <span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col"><button class="sort-head" data-sort="distance" type="button">Minimum separation <span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col"><button class="sort-head" data-sort="speed" type="button">Minimum relative velocity <span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col" class="records-head"><button class="sort-head" data-sort="sources" type="button">Records <span class="sort-indicator" aria-hidden="true"></span></button></th>
      </tr></thead><tbody id="rows"></tbody></table></div>
      <div id="empty" class="empty" hidden></div>
    </section>
  </main>
</body>
</html>
