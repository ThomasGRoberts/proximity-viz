<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded-table")</script>
  <title>Episodes of Concern · ESPL</title>
  <link rel="icon" type="image/png" href="./assets/polyhedron-icon.png">
  <link rel="stylesheet" href="./style.css?v=40">
  <script type="module" src="./app.js?v=55"></script>
  <script type="module" src="./embed-resize.js?v=1"></script>
  <script type="module" src="../visualization/dev/review-shell.js?v=4"></script>
<link rel="stylesheet" href="../shared/episode-loading.css?v=3">
  <link rel="stylesheet" href="../shared/episode-description.css">
</head>
<body>
  <main class="component-wrap">
    <section class="library" aria-label="Episodes of Concern table">
      <div class="toolbar">
        <label class="search-field"><span class="visually-hidden">Search episodes, orbital regimes, or countries</span><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.7"/><path d="m13 13 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search episodes, orbital regimes, or countries…"></label>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <div id="preview-controls" class="preview-controls" hidden><label><input id="preview-toggle" type="checkbox"> <span class="preview-label">Preview all episodes</span> <small>(local development only)</small></label></div>
      <div id="status" class="status" role="status">Loading published records…</div>
      <div class="table-wrap"><table><thead><tr>
        <th scope="col"><span class="table-glossary-label" data-glossary-term="Episode">Episode</span></th>
        <th scope="col">Orbit</th>
        <th scope="col"><span class="table-glossary-label" data-glossary-term="Space Objects">Space objects</span> <span class="column-meta-label">COSPAR ID</span></th>
        <th scope="col"><button class="sort-head" data-sort="date" type="button">Period <span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col"><button class="sort-head metric-heading" data-sort="distance" data-glossary-term="Minimum Separation Distance" type="button"><span class="table-glossary-label">Minimum Separation Distance</span><span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col"><button class="sort-head metric-heading" data-sort="speed" data-glossary-term="Minimum Relative Speed" type="button"><span class="table-glossary-label">Minimum<br>relative<br>speed</span><span class="sort-indicator" aria-hidden="true"></span></button></th>
        <th scope="col" class="records-head">Records</th>
      </tr></thead><tbody id="rows"></tbody></table></div>
      <div id="empty" class="empty" hidden></div>
    </section>
  </main>
</body>
</html>
