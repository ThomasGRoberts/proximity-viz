<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESPL website · local review</title>
  <link rel="icon" type="image/png" href="../assets/polyhedron-icon.png">
  <link rel="stylesheet" href="./review.css">
  <script type="module" src="./review.js"></script>
</head>
<body>
  <header class="review-bar" id="reviewBar">
    <nav class="review-switch" aria-label="Website page previews">
      <details class="review-group"><summary>Top-level</summary><div class="review-group-menu">
        <button type="button" data-preview="home">Home</button><button type="button" data-preview="research">Research</button><button type="button" data-preview="people">People</button><button type="button" data-preview="opportunities">Opportunities</button><button type="button" data-preview="news">News</button>
      </div></details>
      <details class="review-group"><summary>Projects</summary><div class="review-group-menu">
        <button type="button" data-preview="sbi" data-update-version="20261125-mobile-featured-and-author-spacing">SBI</button><button type="button" data-preview="proximity" data-update-version="20261125-mobile-featured-and-author-spacing">Proximity</button><button type="button" data-preview="lunar" data-update-version="20261125-mobile-featured-and-author-spacing">Lunar</button>
      </div></details>
      <details class="review-group"><summary>Areas</summary><div class="review-group-menu">
        <button type="button" data-preview="space-security" data-update-version="20261125-area-mobile-author-rows">Space security</button><button type="button" data-preview="space-sustainability" data-update-version="20261125-area-mobile-author-rows">Space sustainability</button><button type="button" data-preview="space-coordination" data-update-version="20261125-area-mobile-author-rows">Space coordination</button>
      </div></details>
      <details class="review-group"><summary>Tables</summary><div class="review-group-menu">
        <button type="button" data-preview="library">Proximity table</button>
      </div></details>
      <details class="review-group"><summary>Models</summary><div class="review-group-menu">
        <button type="button" data-preview="model-sbi">SBI model</button><button type="button" data-preview="model-proximity">Proximity model</button>
      </div></details>
    </nav>
    <div class="review-actions">
      <button id="refreshPreview" type="button">Refresh page</button>
      <button id="copyHtml" type="button">Copy HTML for WordPress</button>
      <button id="spotMode" type="button" aria-pressed="false">✚ Spot comment</button>
      <button id="commentsToggle" type="button" aria-expanded="false">Comments <span id="commentCount">0</span></button>
    </div>
  </header>
  <p class="review-status" id="reviewStatus" role="status">Loading the website page draft…</p>
  <main class="preview-area" id="previewArea">
    <div id="pageHost" class="page-host" aria-label="Website page preview"></div>
    <div id="pinLayer" class="pin-layer" aria-label="Saved website comment locations"></div>
  </main>
  <div id="spotLayer" class="spot-layer" hidden aria-label="Choose a location on the website page"></div>
  <div id="spotHighlight" class="spot-highlight" hidden aria-hidden="true"></div>
  <aside id="commentDrawer" class="comment-drawer" hidden aria-label="Website page comments">
    <div class="drawer-head"><strong>Website page comments</strong><button id="closeDrawer" type="button" aria-label="Close comments">×</button></div>
    <form id="commentForm" hidden>
      <label for="commentText">Comment on <strong id="commentLocation">—</strong></label>
      <label class="sister-scope" id="sisterScopeLabel" hidden><input id="sisterScope" type="checkbox"> Apply to all <span id="sisterScopeName">sister pages</span></label>
      <textarea id="commentText" rows="5" maxlength="4000" required></textarea>
      <div class="form-actions"><button class="primary" type="submit" id="saveComment">Save comment</button><button id="cancelComment" type="button">Cancel</button></div>
    </form>
    <div id="commentList" class="comment-list"></div>
    <button id="exportComments" class="export-comments" type="button">Export website comments JSON</button>
  </aside>
</body>
</html>
