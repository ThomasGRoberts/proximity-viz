ommy-smith","Photo File":"/files/2026/03/TommySmith_yellow.jpg","Degree Program":"BS Student, Aerospace Engineering","Project Theme":"Space Coordination","Project Topics":"Safety zones in space, Cislunar space, Equitable access to space"}],alumni:[{Name:"Joshua Ferrier","Anchor Name":"joshua-ferrier","Photo File":"/files/2026/09/JoshuaFerrier_gray.jpg","Degree Program":"BS, Aerospace Engineering","Project Theme":"Space Coordination, Space Sustainability"},{Name:"PJ Shinners","Anchor Name":"pj-shinners","Photo File":"/files/2026/09/PJShinners_gray.jpg","Degree Program":"MS Student, Aerospace Engineering","Project Theme":"Space Coordination"},{Name:"Nia Thompson","Anchor Name":"nia-thompson","Photo File":"/files/2026/09/NiaThompson_gray.jpg","Degree Program":"BS Student, Aerospace Engineering","Project Theme":"Space Coordination"}]},positions:[{Title:"Space Policy",Class:"Course","Class Label":"INTA 8803",Color:"Blue",Term:"Fall 2026",Description:'\x3cp>\nAs satellites orbit the Earth hundreds or thousands of kilometers above our heads, they quietly play a critical role in our daily lives, the global economy, and military power. To study space policy is to interrogate the decision-making processes for the civil, commercial, and military uses of outer space from the dawn of the space age to the modern day, spanning issues of international coordination, sustainability, and security in the domain. Through this course, students will learn about the diverse factors that have historically shaped space policy thinking, from the original rationales for spaceflight, to the birth of the commercial space industry, to the development of international systems that promote long-term stability in a rapidly densifying environment. \n\x3c/p>\n\n\x3cp>\nBy engaging with the debates and decisions that have shaped global space activities, students will gain an appreciation for the role of space technologies in global society, the critical challenges facing this domain, and the intricate politics driving contemporary space policy in both the United States and around the world.\n\x3c/p>\n\n\x3ca href="https://www.thomasgroberts.com/s/SpacePolicy_Syllabus.pdf" target="_blank" rel="noopener">See the syllabus →\x3c/a>',"Anchor Name":"space-policy",Theme:"",Tags:""},{Title:"Global Politics of Technology",Class:"Course","Class Label":"INTA 3044 / 8803",Color:"Blue",Term:"Summer 2027",Description:'\x3cp>\nThis course is centered around the question: How do states regulate technology that has consequences across and beyond their borders? Our starting point is understanding the role the state can play in developing technology. Theories of regulatory governance and the "regulatory state" will be used to understand how governments interact with and influence technological\ninnovation. Next, we’ll explore the tactics used by different European governments—as well as the European Union itself—to direct technological development and the "European Paradox." Finally, we evaluate the key tension between regulations that exist within borders and technology that expands beyond. We’ll consider the role that inter-/supranational institutions have played to resolve this tension in the context of big tech, digital services, and space technology.\n\x3c/p>\n\n\x3cp>\nThis course is co-taught with \x3ca href="https://iac.gatech.edu/people/person/1f6a6f21-01fa-5e42-88d2-83a7cd378f57" target="_blank" rel="noopener">Prof. Carly Potz-Nielsen\x3c/a> (INTA) as part of Georgia Tech\'s ten-week, immersive study \x3ca href="https://sites.gatech.edu/gt-eu-summer/" target="_blank" rel="noopener">\x3cem>European Union and Global Affairs\x3c/em> study abroad program\x3c/a>. Students enrolled in the program, directed by \x3ca href="https://iac.gatech.edu/people/person/vicki-birchfield" target="_blank" rel="noopener">Prof. Vicki Birchfield\x3c/a> (INTA) earn 12 credits across four courses: \x3cem>Politics of the European Union\x3c/em> (INTA 2221 / 4903), \x3cem>Transatlantic Relations\x3c/em> (INTA 3223 / 6833), \x3cem>European Security Issues\x3c/em> (INTA 3120 / 6121), and \x3cem>Global Politics of Technology\x3c/em> (INTA 3044 / 8803). This year\'s program runs from May 17 to July 24, 2027, and takes students to: Paris, Metz, and Strasbourg 🇫🇷; Brussels 🇧🇪; Berlin 🇩🇪; Geneva and Bern 🇨🇭; Vienna 🇦🇹; and Bucharest 🇷🇴.\n\x3c/p>\n\n\x3cp>\n\x3ca href="https://atlas.gatech.edu/_portal/tds-program-brochure?programid=10076" target="_blank" rel="noopener">Apply for the Summer 2027 program →\x3c/a>\n\x3c/p>',"Anchor Name":"global-politics-of-technology",Theme:"",Tags:""}]};(function(){"use strict";const fallback=window.ESPL_HOME_FALLBACK;const files="https://sites.gatech.edu/thomas-test-website";const site="https://espl.ae.gatech.edu/";const urls={news:"https://docs.google.com/spreadsheets/d/e/2PACX-1vS8X6CshzRsEGYjxxl4SUIlhIzrsiJ0-8gJ8usPD8mOkLdR3hJ8LIecVLJH8kJxKQdYgy8OAxKuPbr1/pub?gid=1549944245&single=true&output=csv",projects:"https://docs.google.com/spreadsheets/d/e/2PACX-1vT08-Yg6ATv7mk2BiEScmxTdevWRbNiJydlaR2WOdI-QOxtBsj-zeLdvSLmh4zNGNZIPYqjGSQu-gEg/pub?output=csv",people:"https://docs.google.com/spreadsheets/d/e/2PACX-1vREf4bo6ZknVw_ITND5Rtfe8RJufodwkihs9GZBf5p_7tlE5wwgDPcPd9jFjFa2wF4WJP296jhPuApz/pub?output=csv",alumni:"https://docs.google.com/spreadsheets/d/e/2PACX-1vREf4bo6ZknVw_ITND5Rtfe8RJufodwkihs9GZBf5p_7tlE5wwgDPcPd9jFjFa2wF4WJP296jhPuApz/pub?gid=466308581&single=true&output=csv",positions:"https://docs.google.com/spreadsheets/d/e/2PACX-1vTJmcIg2C0MGac1uKIkh8ZQpIFTbuPFXRZeTAjsUcI55ei69NMyVg2lpcmzmQLp9kFBABGs4fRlfVsU/pub?output=csv",publications:"https://docs.google.com/spreadsheets/d/1eW3y9Rsp1vj4Jop-LcUEFNGY-7c2FZzXHDOzUpAGl-o/gviz/tq?tqx=out:json&sheet=View%20%E2%80%93%20Publications"};const today=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date);const date=value=>{const raw=String(value||"").trim();if(!raw)return"";const gviz=raw.match(/^Date\((\d+),(\d+),(\d+)/); n class=\"heading-top\">About\x3c/span>\x3cbr>\n  \x3cspan class=\"heading-bottom\">the Lab\x3c/span>\n\x3c/h2>\n\n\n\n\n\n\n\n\x3cp class=\"wp-block-paragraph\" id=\"about\">The Engineering Space Policy Laboratory (ESPL) at Georgia Tech is an interdisciplinary research group dedicated to engineering a more \x3ca href=\"https://espl.ae.gatech.edu/research/space-coordination/\">coordinated\x3c/a>, \x3ca href=\"https://espl.ae.gatech.edu/research/space-sustainability/\">sustainable\x3c/a>, and \x3ca href=\"https://espl.ae.gatech.edu/research/space-security/\">secure\x3c/a> outer space domain. Housed jointly in the \x3ca href=\"https://ae.gatech.edu/\">Daniel Guggenheim School of Aerospace Engineering\x3c/a> and the \x3ca href=\"https://inta.gatech.edu/\">Sam Nunn School of International Affairs\x3c/a>, ESPL researchers study how space actors—from start-ups to superpowers—behave in an increasingly congested space environment. As a policy-impact laboratory, ESPL develops research products that inform space mission decision-making at the operator, state, and international levels.\x3cbr>\x3cbr>Led by \x3ca href=\"https://espl.ae.gatech.edu/people/#biography\">Prof. Thomas González Roberts\x3c/a>, ESPL complements Georgia Tech&#8217;s world-class programming in both space systems engineering and outer space affairs as it prepares students to become leaders across the international space community.\x3cbr>\x3cbr>\x3ca href=\"https://espl.ae.gatech.edu/research/\" data-type=\"page\" data-id=\"2\" class=\"espl-about-action\">\x3cspan class=\"espl-about-action__label\">Learn more about our \x3cem>Research\x3c/em>\x3c/span>\x3cspan class=\"espl-about-action__arrow\" aria-hidden=\"true\">→\x3c/span>\x3c/a>\x3c/p>\n\x3c/div>\n\n\n\n\x3cdiv class=\"wp-block-genesis-blocks-gb-columns gb-layout-service-3 gb-layout-columns-2 gb-2-col-equal gb-has-custom-background-color gb-columns-center alignfull\" style=\"padding-top:5%;padding-right:5%;padding-bottom:5%;padding-left:5%;background-color:#f4f4f4\">\x3cdiv class=\"gb-layout-column-wrap gb-block-layout-column-gap-5 gb-is-responsive-column\" style=\"max-width:1100px\">\n\x3cdiv class=\"wp-block-genesis-blocks-gb-column gb-block-layout-column\">\x3cdiv class=\"gb-block-layout-column-inner\">\n\x3cdiv id=\"espl-featured-news\" aria-live=\"polite\">\x3carticle class=\"espl-news-paper\">\x3cdiv class=\"espl-news-paper__inner\">\x3cdiv class=\"espl-news-paper__eyebrow\">In the Press\x3c/div>\x3cdiv class=\"espl-news-paper__photo espl-home-fallback-art\" style=\"--espl-static-news-image:url(&quot;https://iac.gatech.edu/sites/default/files/2026-09/espl%203%20rs.jpg&quot;)\">\x3c/div>\x3ch3 class=\"espl-news-paper__headline\">Georgia Tech Experts Are Modeling the &#x27;Golden Dome&#x27; for Global Policymakers\x3c/h3>\x3cp class=\"espl-news-paper__dek\">Lab members Nathan O&#x27;Brien and Fernando Miranda España and Prof. Roberts were featured in Georgia Tech Experts Are Modeling the &#x27;Golden Dome&#x27; for Global Policymakers , a story on on-campus research activities by Georgia Tech&#x27;s Ivan Allen College of Liberal Arts\x3c/p>\x3cdiv class=\"espl-news-paper__foot\">\x3ctime>September 2026\x3c/time>\x3ca class=\"espl-news-paper__source\" href=\"https://iac.gatech.edu/featured-news/09/engineering-space-policy-golden-dome\">Ivan Allen College of Liberal Arts \x3csvg viewBox=\"0 0 18 18\" aria-hidden=\"true\" focusable=\"false\">\x3cpath class=\"espl-news-external__box\" d=\"M7.25 4.25H4.5A1.75 1.75 0 0 0 2.75 6v7.5a1.75 1.75 0 0 0 1.75 1.75H12a1.75 1.75 0 0 0 1.75-1.75v-2.75\">\x3c/path>\x3cg class=\"espl-news-external__arrow\">\x3cpath d=\"M9.25 2.75h6v6\">\x3c/path>\x3cpath d=\"m8 10 7.25-7.25\">\x3c/path>\x3c/g>\x3c/svg>\x3c/a>\x3c/div>\x3c/div>\x3c/article>\x3c/div>\n\x3c/div>\x3c/div>\n\n\n\n\x3cdiv class=\"wp-block-genesis-blocks-gb-column gb-block-layout-column gb-is-vertically-aligned-center\">\x3cdiv class=\"gb-block-layout-column-inner\">\n\x3cdiv id=\"news-espl\">\n  \x3ch2 class=\"wp-block-heading\">\n    \x3cspan class=\"heading-top\">Latest News\x3c/span>\n  \x3c/h2>\n\x3c/div>\n\n\n\n\x3cdiv style=\"height:18px\" aria-hidden=\"true\" class=\"wp-block-spacer\">\x3c/div>\n\n\n\n\x3cdiv id=\"espl-latest\" class=\"espl-latest\" aria-live=\"polite\">\x3cul>\x3cli>\x3cstrong>October 2026:\x3c/strong> Prof. Roberts was awarded a travel grant from the Neal Family Chair Endowment at Georgia Tech to host a side event at the UN Open-Ended Working Group on the Prevention of an Arms Race in Outer Space in Geneva\x3c/li>\x3cli>\x3cstrong>October 2026:\x3c/strong> Prof. Roberts presented at the Council on Strategic Risk&#x27;s Dialogue to Strengthen the Outer Space Treaty and Deter the Placement of Nuclear Weapons in Outer Space co-hosted by the Geneva Centre for Security Policy and the Secure World Foundation in New York City\x3c/li>\x3cli>\x3cstrong>October 2026:\x3c/strong> Prof. Roberts was published in the Geneva Centre for Security Policy&#x27;s Policy Brief series\x3c/li>\x3cli>\x3cstrong>October 2026:\x3c/strong> Prof. Roberts presented at the World Affairs Council of Atlanta\x3c/li>\x3c/ul>\x3c/div>\n\n\x3cdiv style=\"height:12px\" aria-hidden=\"true\" class=\"wp-block-spacer\">\x3c/div>\n\n\n\n\x3cp class=\"wp-block-paragraph\">\x3ca href=\"https://espl.ae.gatech.edu/news/\" data-type=\"page\" data-id=\"416\" class=\"espl-news-archive-action\">\x3cspan class=\"espl-about-action__label\">Read past updates in the \x3cem>News\x3c/em> archive\x3c/span>\x3cspan class=\"espl-about-action__arrow\" aria-hidden=\"true\">→\x3c/span>\x3c/a>\x3c/p>\n\x3c/div>\x3c/div>\n\x3c/div>\x3c/div>\n\n\n\n\n\n\n\n\n\n\x3csection class=\"espl-home-section espl-home-section--projects\" aria-labelledby=\"espl-featured-project-name\">\n  \x3cdiv class=\"espl-home-section__project-banner\">\n    \x3cimg class=\"espl-home-section__project-fallback espl-home-fallback-art\" loading=\"lazy\" src=\"https://sites.gatech.edu/thomas-test-website/files/2026/10/sbi-card.jpg\" alt=\"\">\
