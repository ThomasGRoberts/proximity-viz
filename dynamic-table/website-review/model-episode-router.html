<!-- Add this Custom HTML block after the existing Proximity model iframe on the ESPL model page. -->
<script>
(() => {
  const episode = new URLSearchParams(location.search).get('episode');
  if (!/^E-00[1-8]$/.test(episode || '')) return;
  const frame = [...document.querySelectorAll('iframe')]
    .find(node => node.src.includes('thomasgroberts.github.io/proximity-viz/visualization/'));
  if (!frame) return;
  const url = new URL('https://thomasgroberts.github.io/proximity-viz/visualization/Viz/compare.html');
  url.searchParams.set('published', '1');
  url.searchParams.set('episode', episode);
  frame.src = url.href;
})();
</script>
