<!-- Replace the entire existing Proximity model page HTML block with this block. -->
<div id="espl-proximity-model" style="width:100%;height:100%;min-height:600px">
  <iframe id="espl-proximity-model-frame" src="https://thomasgroberts.github.io/proximity-viz/visualization/e001/" title="Proximity visualization" loading="eager" allow="fullscreen" style="display:block;width:100%;height:100%;min-height:600px;border:0"></iframe>
</div>
<script>
(() => {
  const frame = document.getElementById('espl-proximity-model-frame');
  if (!frame) return;
  const episode = new URLSearchParams(location.search).get('episode');
  if (!/^E-\d{3}$/.test(episode || '')) return;
  const base = 'https://thomasgroberts.github.io/proximity-viz/visualization/';
  const path = episode === 'E-001' ? 'e001/' : episode === 'E-002' ? 'e002/' : 'Viz/compare.html';
  const url = new URL(path, base);
  url.searchParams.set('episode', episode);
  if (path === 'Viz/compare.html') url.searchParams.set('published', '1');
  frame.src = url.href;
})();
</script>
